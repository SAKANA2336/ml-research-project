name: Protect raw data

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  protect-raw-data:
    name: protect-raw-data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject changes to existing raw data
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changes="$(git diff --name-status --find-renames "$BASE_SHA" "$HEAD_SHA" -- data/raw/)"
          printf '%s\n' "$changes"

          violations="$(printf '%s\n' "$changes" | awk 'NF > 0 && $1 !~ /^A$/')"
          if [[ -n "$violations" ]]; then
            echo "Existing files under data/raw may not be modified, deleted, moved, or renamed."
            echo "Add a new batch directory and document corrections instead."
            exit 1
          fi
